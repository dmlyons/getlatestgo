name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [stable, oldstable]
    name: Build and test (Go ${{ matrix.go-version }})
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

    - name: Vet
      run: go vet ./...

  gui:
    runs-on: ubuntu-latest
    name: Build GUI (Fyne, Docker)
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - name: Build and vet (gui/Dockerfile)
      uses: docker/build-push-action@v6
      with:
        context: .
        file: gui/Dockerfile
        outputs: type=cacheonly
        cache-from: type=gha,scope=gui-linux-amd64
        cache-to: type=gha,mode=max,scope=gui-linux-amd64
