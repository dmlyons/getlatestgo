# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: ['tar.gz']
    format_overrides:
      - goos: windows
        formats: ['zip']
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

# GUI archives are built by the `gui` job in .github/workflows/release.yml
# (cgo + Fyne via gui/Dockerfile) and downloaded into dist-gui/ beforehand.
checksum:
  name_template: 'checksums.txt'
  extra_files:
    - glob: ./dist-gui/*.tar.gz

release:
  extra_files:
    - glob: ./dist-gui/*.tar.gz

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
